[project]
name = "ctxautopsy"
version = "0.1.0"
description = "CtxAutopsy（上下文验尸官）：审计 agent 上下文压缩的真实代价 —— 模块 A session_log / 模块 B billing"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxautopsy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
